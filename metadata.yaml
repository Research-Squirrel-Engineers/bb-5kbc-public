# =============================================================================
# metadata.yaml — the only metadata file maintained by hand.
#
# Everything else in this repository is generated from it by
# https://github.com/Research-Squirrel-Engineers/n4o-kg-profile (pinned to @v1
# in .github/workflows/build.yml).
#
# Counted, not typed in: class and property counts come from the bundle.
# TODO markers are deliberate — nothing here is guessed.
# =============================================================================

"@context": https://w3id.org/nfdi4objects/profile/v0.1/context.jsonld

# --- 1. What the N4O KG needs to register the collection ---------------------

id: https://graph.nfdi4objects.net/collection/TODO   # assigned by NFDI4Objects
type: [Database, Dataset]

title:
  en: "BB-5KBC: archaeological sites in Brandenburg, East Germany and West Poland around 5000 BC"
  de: "BB-5KBC: Fundstellen in Brandenburg, Ostdeutschland und Westpolen um 5000 v. Chr."

homepage: https://doi.org/10.5281/zenodo.19830968
sameAs: http://www.wikidata.org/entity/QTODO         # TODO: create the item
license: https://creativecommons.org/licenses/by/4.0/

isPartOf: https://graph.nfdi4objects.net/collection/

# --- 2. NCMDP core -----------------------------------------------------------

description:
  en: >-
    Linked Open Data representation of some 540 archaeological sites in
    Brandenburg, East Germany and West Poland dating to around 5000 BC, with
    dating, cultural attribution, discovery events and georeferencing. The
    application ontology aligns with CIDOC CRM and its extensions CRMgeo,
    CRMsci and CRMarchaeo, with FSL for fuzzy statements and PROV-O for the
    provenance of the pipeline itself.
  de: >-
    Linked-Open-Data-Aufbereitung von rund 540 archaeologischen Fundstellen in
    Brandenburg, Ostdeutschland und Westpolen um 5000 v. Chr., mit Datierung,
    kultureller Zuordnung, Entdeckungsereignissen und Georeferenzierung. Die
    Anwendungsontologie ist auf CIDOC CRM und seine Erweiterungen CRMgeo,
    CRMsci und CRMarchaeo ausgerichtet, auf FSL fuer unscharfe Aussagen und auf
    PROV-O fuer die Provenienz der Pipeline selbst.

