%YAML 1.2
---
# =============================================================================
# metadata.yaml — the only metadata file maintained by hand.
#
# Everything else in this repository is generated from it by
# https://github.com/Research-Squirrel-Engineers/n4o-kg-profile (pinned to @v1
# in .github/workflows/build.yml).
#
# Counted, not typed in: class and property counts come from the bundle.
# TODO markers are deliberate — nothing here is guessed.
# =============================================================================

"@context": https://w3id.org/nfdi4objects/profile/v0.1/context.jsonld

# --- 1. What the N4O KG needs to register the collection ---------------------

id: https://graph.nfdi4objects.net/collection/TODO   # assigned by NFDI4Objects
type: [Database, Dataset]

title:
  en: "BB-5KBC: archaeological sites in Brandenburg, East Germany and West Poland around 5000 BC"
  de: "BB-5KBC: Fundstellen in Brandenburg, Ostdeutschland und Westpolen um 5000 v. Chr."

homepage: https://doi.org/10.5281/zenodo.19830968
sameAs: http://www.wikidata.org/entity/Q141363969
license: https://creativecommons.org/licenses/by/4.0/

isPartOf: https://graph.nfdi4objects.net/collection/

# --- 2. NCMDP core -----------------------------------------------------------

description:
  en: >-
    Linked Open Data representation of some 540 archaeological sites in
    Brandenburg, East Germany and West Poland dating to around 5000 BC, with
    dating, cultural attribution, discovery events and georeferencing. The
    application ontology aligns with CIDOC CRM and its extensions CRMgeo,
    CRMsci and CRMarchaeo, with FSL for fuzzy statements and PROV-O for the
    provenance of the pipeline itself.
  de: >-
    Linked-Open-Data-Aufbereitung von rund 540 archaeologischen Fundstellen in
    Brandenburg, Ostdeutschland und Westpolen um 5000 v. Chr., mit Datierung,
    kultureller Zuordnung, Entdeckungsereignissen und Georeferenzierung. Die
    Anwendungsontologie ist auf CIDOC CRM und seine Erweiterungen CRMgeo,
    CRMsci und CRMarchaeo ausgerichtet, auf FSL fuer unscharfe Aussagen und auf
    PROV-O fuer die Provenienz der Pipeline selbst.

creators:
  - type: [Person]
    name: Thiery, Florian
    givenName: Florian
    familyName: Thiery
    orcid: https://orcid.org/0000-0002-3246-3531
    affiliation:
      type: [Organization]
      name: LEIZA — Leibniz-Zentrum für Archäologie
  - type: [Person]
    name: Schmidt, Sophie C.
    givenName: Sophie C.
    familyName: Schmidt
    orcid: https://orcid.org/0000-0003-4696-2101
    affiliation:
      type: [Organization]
      name: Freie Universität Berlin

publisher:
  type: [Organization]
  name: Research Squirrel Engineers Network

issued: '2026-04-27'      # TODO: date of the Zenodo release being described
modified: '2026-08-19'
version: '0.11.0'

resourceType: http://purl.org/dc/dcmitype/Dataset
accessRights: http://publications.europa.eu/resource/authority/access-right/PUBLIC
landingPage: https://research-squirrel-engineers.github.io/bb-5kbc-sites/

keywords:
  - Archaeology
  - Neolithic
  - Brandenburg
  - Linked Open Data
  - CIDOC CRM
  - SHACL

language:
  - http://id.loc.gov/vocabulary/iso639-1/de
  - http://id.loc.gov/vocabulary/iso639-1/en

conformsTo:
  - https://w3id.org/nfdi4objects/profile/v0.1
  - http://data.europa.eu/r5r/

# --- 3. What gets loaded into the graph --------------------------------------
# The bundle is built in the source repository (bb-5kbc-sites), fetched once by
# `source:` and archived here, so this repository holds a citable copy of
# exactly the version that was loaded. Its SHA-256 is recorded in
# dist/metadata.ttl.

distributions:
  - role: bundle
    title:
      en: RDF bundle (data and ontology)
      de: RDF-Bundle (Daten und Ontologie)
    file: rdf/bb5kbc-bundle.ttl
    source: https://raw.githubusercontent.com/Research-Squirrel-Engineers/bb-5kbc-sites/main/dist/bb5kbc-bundle.ttl
    accessURL: https://github.com/Research-Squirrel-Engineers/bb-5kbc-sites/
    downloadURL: https://raw.githubusercontent.com/Research-Squirrel-Engineers/bb-5kbc-sites/main/dist/bb5kbc-bundle.ttl
    mediaType: https://www.iana.org/assignments/media-types/text/turtle

# --- 4. Model: alignment to CIDOC CRM ----------------------------------------
# Nothing to declare here. The bundle carries its own CIDOC CRM anchoring —
# bb5kbc:Fundstelle rdfs:subClassOf crm:E27_Site and so on — and the build reads
# it out transitively rather than restating it. Restating it is how the two come
# to disagree: an earlier version of this file claimed Entdeckung -> E5_Event
# while the bundle says crmsci:S19_Encounter_Event.
#
# `classes:` is only for a class the bundle does *not* anchor, and any entry
# that contradicts the bundle is reported and, under strict, fails the build.
#
# Currently unanchored: the five fuzzy-sl types. They come from
# fuzzy-sl.squirrel.link, so the decision belongs in that ontology, not here.
# Either anchor them upstream, or list their namespace under `external:` to
# record that reusing them unanchored is deliberate.

model:
  bundle: rdf/bb5kbc-bundle.ttl

# --- 5. Example queries ------------------------------------------------------
# Maintained once, shipped three ways: as the query page, as .rq files, and as
# sh:SPARQLSelectExecutable in dist/metadata.ttl, where the N4O KG can harvest
# them. Every one of them is executed at build time; zero rows fails the build.

# --- 5. Map ------------------------------------------------------------------
# One map of the whole collection at docs/map.html. The colour menu is built
# from whatever columns the query returns, so editing the query is how you
# re-colour the map.

map:
  title:
    en: Where the sites are
    de: Wo die Fundstellen liegen
  intro:
    en: >-
      All 540 sites, with their cultural attribution and the confidence of
      their location. The four confidence levels come from the FSL vocabulary:
      Q23 direct from the database, Q15 locatable to a district, Q24 only to a
      municipality centroid, Q113 a coordinate error.
    de: >-
      Alle 540 Fundstellen mit kultureller Zuordnung und Verortungsguete.
  colour_column: culture
  sparql: |
    SELECT ?label ?culture ?confidence ?wkt WHERE {
      ?site a bb5kbc:Fundstelle ; rdfs:label ?label ;
            geo:hasGeometry/geo:asWKT ?wkt ;
            fsl:certaintyLevel ?cl ;
            bb5kbc:hatKulturelleZuordnung/bb5kbc:hatKulturgruppe/rdfs:label ?culture .
      BIND(REPLACE(STR(?cl), "^.*/", "") AS ?confidence)
    }

# --- 6. Example queries ------------------------------------------------------
# Maintained once, shipped four ways: one page each under docs/query/, all of
# them on docs/query/all.html, as .rq files, and as sh:SPARQLSelectExecutable
# in dist/metadata.ttl where the N4O KG can harvest them. Every one is executed
# at build time; zero rows fails the build.
#
# Note the join path for dating: bb5kbc:hatDatierung hangs on the
# KulturelleZuordnung, not on the Fundstelle, because a site with two cultural
# attributions has two datings. `?site bb5kbc:hatDatierung ?d` returns nothing.

prefixes: |
  PREFIX bb5kbc: <http://w3id.org/bb5kbc/ont/>
  PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
  PREFIX fsl: <http://fuzzy-sl.squirrel.link/ontology/>
  PREFIX geo: <http://www.opengis.net/ont/geosparql#>
  PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
  PREFIX skos: <http://www.w3.org/2004/02/skos/core#>

queries:
  - id: sites-on-a-map
    view: map
    view_columns: {label: label, colour: culture}
    title:
      en: The sites, on a map
      de: Die Fundstellen auf der Karte
    intro:
      en: >-
        Every site with its cultural attribution. Any result carrying a
        coordinate is drawn on a map above the table, whatever else the query
        asks for — so an edit that adds a filter narrows the map with it.
      de: >-
        Jede Fundstelle mit ihrer kulturellen Zuordnung, als Karte ueber der
        Tabelle.
    sparql: |
      SELECT ?label ?culture ?wkt WHERE {
        ?site a bb5kbc:Fundstelle ; rdfs:label ?label ;
              geo:hasGeometry/geo:asWKT ?wkt ;
              bb5kbc:hatKulturelleZuordnung/bb5kbc:hatKulturgruppe/rdfs:label ?culture .
      } ORDER BY ?culture ?label

  - id: culture-chronology
    view: intervals
    view_columns: {from: from, to: to, label: culture}
    title:
      en: The cultural groups on a time axis
      de: Die Kulturgruppen auf der Zeitachse
    intro:
      en: >-
        Where each cultural group sits in time, and how many sites carry it.
        The Mesolithic bar spans four thousand years and dwarfs everything
        else: that is the record, not a drawing error. Add
        FILTER(?st >= -5500) to see the Neolithic groups at a readable scale.
      de: >-
        Wo jede Kulturgruppe zeitlich liegt und wie viele Fundstellen sie
        traegt. Der Mesolithikum-Balken umspannt vier Jahrtausende.
    sparql: |
      SELECT ?culture (MIN(?st) AS ?from) (MAX(?en) AS ?to)
             (COUNT(DISTINCT ?site) AS ?sites) WHERE {
        ?site bb5kbc:hatKulturelleZuordnung ?kz .
        ?kz bb5kbc:hatKulturgruppe/rdfs:label ?culture ;
            bb5kbc:hatDatierung ?d .
        ?d bb5kbc:datierungStart ?st ; bb5kbc:datierungEnd ?en .
      } GROUP BY ?culture ORDER BY ?from

  - id: time-slice
    view: map
    view_columns: {label: label, colour: culture}
    controls:
      - {var: from, label: "From (BC)", min: -8000, max: -3800, step: 50}
      - {var: to,   label: "To (BC)",   min: -8000, max: -3800, step: 50}
    title:
      en: What existed in a window of time
      de: Was in einem Zeitfenster bestand
    intro:
      en: >-
        Sites whose dating interval overlaps the window set by the two sliders.
        Move either one and the query re-runs: -4800 to -4750 gives 349 sites,
        -4400 to -4300 gives 472, -4100 to -3900 gives 296. The test is overlap,
        not containment, so a site counts if it was in use at any point in the
        window — with intervals this wide that is the only honest reading.
        Widen the window to the full range and all 540 come back.
      de: >-
        Fundstellen, deren Datierungsintervall sich mit dem Fenster der beiden
        Regler ueberschneidet. Geprueft wird Ueberschneidung, nicht
        Enthaltensein: bei so weiten Intervallen ist das die einzige ehrliche
        Lesart.
    sparql: |
      SELECT ?label ?culture ?wkt WHERE {
        VALUES ?from { -4700 }
        VALUES ?to   { -4500 }
        ?site rdfs:label ?label ;
              geo:hasGeometry/geo:asWKT ?wkt ;
              bb5kbc:hatKulturelleZuordnung ?kz .
        ?kz bb5kbc:hatKulturgruppe/rdfs:label ?culture ;
            bb5kbc:hatDatierung ?d .
        ?d bb5kbc:datierungStart ?st ; bb5kbc:datierungEnd ?en .
        FILTER(?st <= ?to && ?en >= ?from)
      } ORDER BY ?culture ?label

  - id: discovery-and-type
    view: barchart
    view_columns: {category: mode, value: sites}
    title:
      en: How the sites were found
      de: Wie die Fundstellen entdeckt wurden
    intro:
      en: >-
        The site type is known almost only where somebody excavated: stray
        finds and surface collections account for most of the record and leave
        the type unknown. That is a fact about research history rather than
        about prehistory, and it belongs beside every distribution map here.
        Group by ?type as well to see the cross-tabulation.
      de: >-
        Der Fundstellentyp ist fast nur dort bekannt, wo gegraben wurde — eine
        Aussage ueber die Forschungsgeschichte, nicht ueber die Vorgeschichte.
    sparql: |
      SELECT ?mode (COUNT(DISTINCT ?site) AS ?sites) WHERE {
        ?site bb5kbc:wurdeEntdecktDurch/bb5kbc:hatEntdeckungsart/rdfs:label ?mode .
      } GROUP BY ?mode ORDER BY DESC(?sites)

  - id: dating-precision
    view: scatter
    view_columns: {x: sites, y: widest, label: culture}
    title:
      en: How sharply each group is dated
      de: Wie scharf jede Gruppe datiert ist
    intro:
      en: >-
        The width of the dating interval, per cultural group, against the
        number of sites. A group in the lower right is both well represented
        and tightly dated; one at the top is carried by an interval so wide
        that little follows from it.
      de: >-
        Breite des Datierungsintervalls je Kulturgruppe gegen die Anzahl der
        Fundstellen.
    sparql: |
      SELECT ?culture (COUNT(DISTINCT ?site) AS ?sites)
             (MIN(?span) AS ?tightest) (MAX(?span) AS ?widest) WHERE {
        ?site bb5kbc:hatKulturelleZuordnung ?kz .
        ?kz bb5kbc:hatKulturgruppe/rdfs:label ?culture ;
            bb5kbc:hatDatierung ?d .
        ?d bb5kbc:datierungStart ?st ; bb5kbc:datierungEnd ?en .
        BIND(?en - ?st AS ?span)
      } GROUP BY ?culture ORDER BY ?widest

  - id: locational-confidence
    view: map
    view_columns: {label: label, colour: confidence}
    title:
      en: How well each site is located
      de: Wie gut jede Fundstelle verortet ist
    intro:
      en: >-
        The same points as the first map, coloured by the FSL confidence item
        instead of by culture: Q23 taken directly from the database, Q15
        locatable to a district, Q24 only to a municipality centroid. A cluster
        of Q24 is a cluster of centroids, not a cluster of settlement.
      de: >-
        Dieselben Punkte, gefaerbt nach FSL-Verortungsguete statt nach Kultur.
        Eine Haeufung von Q24 ist eine Haeufung von Mittelpunkten.
    sparql: |
      SELECT ?label ?confidence ?accuracy ?wkt WHERE {
        ?site a bb5kbc:Fundstelle ; rdfs:label ?label ;
              geo:hasGeometry/geo:asWKT ?wkt ;
              fsl:certaintyLevel ?cl ;
              bb5kbc:hatGenauigkeit ?accuracy .
        BIND(REPLACE(STR(?cl), "^.*/", "") AS ?confidence)
      } ORDER BY ?confidence

  - id: uncertain-attributions
    view: map
    view_columns: {label: label, colour: type}
    title:
      en: Where the record hedges
      de: Wo die Quellen zoegern
    intro:
      en: >-
        Values the source marked with a question mark are not quietly cleaned
        up in this dataset: they carry fsl:certaintyDesc "uncertain". These are
        the site types the excavator would not commit to.
      de: >-
        Mit Fragezeichen markierte Werte werden nicht stillschweigend bereinigt,
        sondern tragen fsl:certaintyDesc "uncertain".
    sparql: |
      SELECT ?label ?type ?wkt WHERE {
        ?site bb5kbc:hatFundstellenart ?t ; rdfs:label ?label ;
              geo:hasGeometry/geo:asWKT ?wkt .
        ?t fsl:certaintyDesc "uncertain"@en ; rdfs:label ?type .
      } ORDER BY ?label

  - id: literature-coverage
    view: barchart
    view_columns: {category: kreis, value: sites}
    title:
      en: Sites per district, and how many are published
      de: Fundstellen je Kreis, und wie viele publiziert sind
    intro:
      en: >-
        Where the corpus is dense and where the literature is thin. A district
        with many sites and few publications is not necessarily under-researched
        — it may be that its excavations are reported in a form the source
        database does not cite.
      de: >-
        Wo der Bestand dicht ist und wo die Literatur duenn wird.
    sparql: |
      SELECT ?kreis (COUNT(DISTINCT ?site) AS ?sites)
             (COUNT(DISTINCT ?pub) AS ?published) WHERE {
        ?site a bb5kbc:Fundstelle ;
              bb5kbc:inGemeinde/bb5kbc:inKreis/rdfs:label ?kreis .
        OPTIONAL { ?site bb5kbc:hatPublikation ?p BIND(?site AS ?pub) }
      } GROUP BY ?kreis ORDER BY DESC(?sites)

  - id: georeferencing-source
    view: barchart
    view_columns: {category: source, value: sites}
    title:
      en: Where the coordinates came from
      de: Woher die Koordinaten stammen
    intro:
      en: >-
        Every coordinate in this dataset was assigned by a georeferencing
        activity that records its own source. Provenance of the geometry, not
        of the site.
      de: >-
        Jede Koordinate stammt aus einer Georeferenzierungs-Aktivitaet, die
        ihre Quelle mitfuehrt.
    sparql: |
      SELECT ?source (COUNT(DISTINCT ?site) AS ?sites) WHERE {
        ?site bb5kbc:wurdeGeoreferenziertDurch ?a .
        ?a fsl:hasSourceType/rdfs:label ?source .
      } GROUP BY ?source ORDER BY DESC(?sites)

  - id: cross-border
    view: barchart
    view_columns: {category: culture, value: sites}
    title:
      en: German and Polish sites per cultural group
      de: Deutsche und polnische Fundstellen je Kulturgruppe
    intro:
      en: >-
        The dataset straddles a modern border that means nothing to the fifth
        millennium BC. Grouping by country and culture shows which groups the
        border cuts through and which sit wholly on one side — a property of
        research traditions and of the source databases as much as of
        prehistory.
      de: >-
        Der Datensatz ueberschreitet eine moderne Grenze, die dem 5. Jahrtausend
        v. Chr. nichts bedeutet.
    sparql: |
      SELECT ?culture ?land (COUNT(DISTINCT ?site) AS ?sites) WHERE {
        ?site bb5kbc:inGemeinde/bb5kbc:inKreis/bb5kbc:inBundesland/bb5kbc:inLand/rdfs:label ?land ;
              bb5kbc:hatKulturelleZuordnung/bb5kbc:hatKulturgruppe/rdfs:label ?culture .
      } GROUP BY ?culture ?land ORDER BY DESC(?sites)

  - id: classes-with-counts
    title:
      en: Classes used, with counts
      de: Verwendete Klassen mit Anzahl
    intro:
      en: >-
        What this collection actually contains — the counterpart to the
        void:classPartition statistics in the metadata. If the two disagree,
        the metadata is stale.
      de: >-
        Was die Sammlung tatsaechlich enthaelt — die Gegenprobe zur
        void:classPartition-Statistik.
    sparql: |
      SELECT ?class (COUNT(?s) AS ?count) WHERE {
        ?s a ?class
      } GROUP BY ?class ORDER BY DESC(?count)

  - id: sites-via-crm
    title:
      en: Sites via their CIDOC CRM superclass
      de: Fundstellen ueber die CIDOC-CRM-Oberklasse
    intro:
      en: >-
        Checks that the alignment holds: the query asks for crm:E27_Site and is
        answered from bb5kbc:Fundstelle. This is what lets the collection be
        queried alongside other N4O collections that never heard of this
        ontology.
      de: >-
        Prueft, ob die Ausrichtung haelt: gefragt wird nach crm:E27_Site,
        geantwortet aus bb5kbc:Fundstelle.
    sparql: |
      SELECT (COUNT(DISTINCT ?site) AS ?sites) WHERE {
        ?site a/rdfs:subClassOf* crm:E27_Site
      }
