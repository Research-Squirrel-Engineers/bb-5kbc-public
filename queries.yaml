queries:
- id: classes-with-counts
  title: Classes used, with counts
  intro: 'What this collection actually contains. The counterpart to the void:classPartition statistics
    in the metadata: if the two disagree, the metadata is stale.'
  sparql: "SELECT ?class (COUNT(?s) AS ?count) WHERE {\n  ?s a ?class\n} GROUP BY ?class ORDER BY DESC(?count)\n"
- id: sites
  title: Sites with their labels
  intro: The archaeological sites themselves, the backbone of the dataset.
  sparql: "SELECT ?site ?label WHERE {\n  ?site a bb5kbc:Fundstelle ;\n        rdfs:label ?label\n} ORDER\
    \ BY ?label LIMIT 50\n"
- id: sites-via-crm
  title: Sites via their CIDOC CRM superclass
  intro: 'Checks that the alignment works: the query asks for crm:E27_Site and is answered from bb5kbc:Fundstelle.
    This is what makes the collection queryable alongside other N4O collections that never heard of this
    ontology.'
  sparql: "SELECT (COUNT(DISTINCT ?site) AS ?sites) WHERE {\n  ?site a/rdfs:subClassOf* crm:E27_Site\n\
    }\n"
