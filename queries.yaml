page:
  title: 'BB-5KBC: archaeological sites in Brandenburg, East Germany and West Poland around 5000 BC'
  intro: Linked Open Data representation of some 540 archaeological sites in Brandenburg, East Germany
    and West Poland dating to around 5000 BC, with dating, cultural attribution, discovery events and
    georeferencing. The application ontology aligns with CIDOC CRM and its extensions CRMgeo, CRMsci and
    CRMarchaeo, with FSL for fuzzy statements and PROV-O for the provenance of the pipeline itself.
